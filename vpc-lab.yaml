AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Highly Available Multi-AZ VPC with NAT Gateways, SSM-only EC2 Management,
  Apache Web Tier (UserData), and Private App Tier.
  Compliant with the CFN Lab requirements.

Parameters:
  Environment:
    Type: String
    Default: Lab
    Description: Environment name used for resource tagging
  FullName:
    Type: String
    Default: Kobby
    Description: Your full name displayed on the web page
  LabName:
    Type: String
    Default: Multi-AZ VPC Lab
    Description: Lab name displayed on the web page
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: EC2 instance type for all instances

Resources:
  # VPC & INTERNET GATEWAY
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-VPC
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-IGW

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # PUBLIC SUBNETS
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Public-A
        - Key: Tier
          Value: Public
        - Key: AZ
          Value: !Select [0, !GetAZs '']

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Public-B
        - Key: Tier
          Value: Public
        - Key: AZ
          Value: !Select [1, !GetAZs '']

  # PRIVATE SUBNETS
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Private-A
        - Key: Tier
          Value: Private
        - Key: AZ
          Value: !Select [0, !GetAZs '']

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Private-B
        - Key: Tier
          Value: Private
        - Key: AZ
          Value: !Select [1, !GetAZs '']

  # ELASTIC IPS & NAT GATEWAYS
  EIPNatA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  EIPNatB:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NATGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EIPNatA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-NAT-A

  NATGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EIPNatB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-NAT-B

  # ROUTE TABLES
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Public-RT

  # Route for public subnets -> IGW
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Associate public subnets with the public route table
  PublicSubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private route table for AZ A -> NAT in AZ A
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Private-RT-A

  PrivateRouteAToNAT:
    Type: AWS::EC2::Route
    DependsOn: NATGatewayA
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGatewayA

  PrivateSubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  # Private route table for AZ B -> NAT in AZ B
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Private-RT-B

  PrivateRouteBToNAT:
    Type: AWS::EC2::Route
    DependsOn: NATGatewayB
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGatewayB

  PrivateSubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # IAM ROLE & INSTANCE PROFILE FOR SSM
  SSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-SSM-Role

  SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref SSMRole]

  # SECURITY GROUPS
  # Public Web SG: allow HTTP from anywhere, ICMP for validation.
  # Outbound: HTTPS (443), DNS (UDP 53), and ICMP.
  PublicSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and ICMP inbound. Outbound for updates and SSM.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP web access
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: ICMP ping for validation
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for SSM and updates
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS resolution
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: ICMP outbound
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Public-SG

  # Private App SG: no inbound HTTP, only ICMP (validation).
  # Outbound same as public: HTTPS, DNS, ICMP.
  PrivateSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ICMP inbound only. Outbound for updates and SSM.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: ICMP ping for validation
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for SSM and updates
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS resolution
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: ICMP outbound
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Private-SG

  # EC2 INSTANCES
  # UserData script for public web instances
  WebUserData:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/web-userdata
      Type: String
      Value: !Sub |
        #!/bin/bash
        set -e
        # Update system and install Apache
        yum update -y
        yum install -y httpd
        systemctl start httpd
        systemctl enable httpd
        # Create custom web page with full name and lab name
        cat > /var/www/html/index.html << EOF
        <!DOCTYPE html>
        <html>
        <head><title>${LabName}</title></head>
        <body>
          <h1>${FullName}</h1>
          <p>Lab Name: ${LabName}</p>
          <p>Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)</p>
          <p>Availability Zone: $(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)</p>
        </body>
        </html>
        EOF

  # Public Web Instance A (AZ A)
  PublicWebA:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetA
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref PublicSG]
      UserData: !Ref WebUserData
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Web-A
        - Key: Tier
          Value: Web

  # Public Web Instance B (AZ B)
  PublicWebB:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetB
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref PublicSG]
      UserData: !Ref WebUserData
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-Web-B
        - Key: Tier
          Value: Web

  # Private App Instance A (AZ A)
  PrivateAppA:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnetA
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref PrivateSG]
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-App-A
        - Key: Tier
          Value: Application

  # Private App Instance B (AZ B)
  PrivateAppB:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnetB
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref PrivateSG]
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-App-B
        - Key: Tier
          Value: Application

# OUTPUTS (for validation)
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  PublicWebA_IP:
    Description: Public IP of Web Instance A
    Value: !GetAtt PublicWebA.PublicIp

  PublicWebB_IP:
    Description: Public IP of Web Instance B
    Value: !GetAtt PublicWebB.PublicIp

  SSMConnectCommand:
    Description: Example SSM Session Manager command (replace <instance-id>)
    Value: "aws ssm start-session --target <instance-id>"

  PrivateInstances_IDS:
    Description: Private instance IDs for SSM access
    Value: !Sub "PrivateAppA: ${PrivateAppA}, PrivateAppB: ${PrivateAppB}"